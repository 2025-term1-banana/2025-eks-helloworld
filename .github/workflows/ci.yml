name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install flake8
          pip install -r requirements.txt

      - name: Lint
        run: flake8 app.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build-image
        run: |
          IMAGE_TAG=$(date +%Y%m%d%H%M%S)
          docker build -t ${{ secrets.ECR_REGISTRY }}/flask-hello:$IMAGE_TAG .
          docker push ${{ secrets.ECR_REGISTRY }}/flask-hello:$IMAGE_TAG
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update GitOps repo with new image tag
        run: |
          git config --global user.email "bot@example.com"
          git config --global user.name "CI Bot"

          git clone ${{ secrets.GITOPS_REPO }} gitops
          cd gitops

          sed -i "s#image: .*#image: ${{ secrets.ECR_REGISTRY }}/flask-hello:${{ steps.build-image.outputs.image_tag }}#g" ${{ secrets.GITOPS_DEPLOY_PATH }}

          git add .
          git commit -m "Update image to ${{ steps.build-image.outputs.image_tag }}"
          git push
